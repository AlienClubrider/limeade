<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0C1326">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Limeade">
  <meta name="color-scheme" content="dark light">
  <title>Limeade</title>
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icons/192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple.png?v=2">
  <link rel="stylesheet" href="/styles.css?v=24">
  <script>
    // Theme before first paint: dark unless this device chose light.
    document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'
    // The installed app's title bar (Mac/Windows) and phone status bar follow the theme too.
    document.querySelector('meta[name=theme-color]').content = document.documentElement.dataset.theme === 'light' ? '#FFFFFF' : '#0C1326'
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="menu" id="menu" aria-label="Menu" aria-controls="drawer" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 class="title" id="title">Assistant</h1>
      <span class="conn" id="conn" hidden>Reconnecting…</span>
      <span id="top-actions"></span>
    </header>
    <main id="views">
      <section id="view-assistant" class="view">
        <div class="scroll" id="thread"></div>
        <div id="assistant-composer"></div>
      </section>
      <section id="view-chat" class="view" hidden><div class="scroll" id="chats"></div></section>
      <section id="view-workers" class="view" hidden><div class="scroll" id="workers"></div></section>
      <section id="view-toolbox" class="view" hidden><div class="scroll" id="toolbox"></div></section>
    </main>
  </div>
  <div id="drawer-root" hidden>
    <div class="scrim drawer-scrim" id="drawer-scrim"></div>
    <nav class="drawer" id="drawer" aria-label="Main">
      <div class="drawer-head"><span>Limeade</span><button class="side-toggle" id="side-toggle" aria-label="Collapse sidebar" title="Collapse sidebar (Ctrl+B)" aria-expanded="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg></button></div>
      <button data-tab="assistant"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Assistant</span><b class="badge" id="badge-assistant" hidden></b></button>
      <button data-tab="workers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 19c.6-3.4 3-5 6-5s5.4 1.6 6 5M14.5 14.3c.8-.3 1.6-.4 2.5-.4 2.4 0 4.1 1.3 4.6 4.1"/></svg><span>Workers</span></button>
      <button data-tab="chat"><svg viewBox="0 0 24 24"><path d="M3.5 5h11v7.5H8L4.5 15.5V12.5h-1zM10 15.5h5.5l3 3V15.5h2V8h-3.5"/></svg><span>Chat</span></button>
      <button data-tab="mcp"><svg viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"/></svg><span>MCP</span></button>
      <button data-tab="skill"><svg viewBox="0 0 24 24"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg><span>Skills</span></button>
      <button data-tab="agent"><svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4M9.5 13v1.5M14.5 13v1.5M2.5 13v3M21.5 13v3"/></svg><span>Agents</span></button>
      <button id="drawer-models"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span>Local Models</span></button>
      <div class="drawer-gap"></div>
      <button id="drawer-settings"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></button>
    </nav>
  </div>
  <div id="pages"></div>
  <div id="sheet-root"></div>
  <div id="toast" hidden></div>
  <script src="/md.js"></script>
  <script src="/clip.js"></script>
  <script src="/list-width.js"></script>
  <script src="/live-turn.js"></script>
  <script src="/follow.js"></script>
  <script src="/on-screen.js"></script>
  <script src="/app.js?v=27"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register("/sw.js")</script>
</body>
</html>
